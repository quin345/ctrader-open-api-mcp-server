[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ctrader-mcp-server"
version = "0.1.0"
description = "cTrader Open API integration for Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "cTrader MCP Server Contributors"}
]

keywords = ["mcp", "ctrader", "trading", "finance", "ai", "llm", "model-context-protocol", "forex", "cfd"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "ctrader-open-api==0.9.2",
    # 21.1.0 is the newest service-identity compatible with the
    # pyOpenSSL==24.1.0 pin imposed by ctrader-open-api (newer versions
    # require cryptography>=43, which breaks that pin).
    "service-identity==21.1.0",
    "fastmcp>=3.1.0,<4",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/"
Repository = "https://github.com/"
Documentation = "https://github.com/#readme"

[project.scripts]
ctrader-mcp-server = "ctrader_mcp_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ctrader_mcp_server"]

[tool.hatch.build]
include = [
    "src/ctrader_mcp_server/**/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
asyncio_mode = "auto"
markers = [
    "integration: requires live cTrader API credentials (CTRADER_ACCESS_TOKEN, CTRADER_ACCOUNT_ID)",
]
